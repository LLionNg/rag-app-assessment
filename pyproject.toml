[project]
name = "rag-app-assessment"
version = "0.1.0"
description = "Two-agent RAG system: a retrieval specialist and a report writer, orchestrated with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "gradio>=6.0.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.60",
    "loguru>=0.7.2",
    "numpy>=2.0.0",
    "openai>=1.60.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# Local BGE-M3 embeddings. Heavy (pulls torch); install only when using them:
#   uv sync --extra bge          sentence-transformers backend
#   uv sync --extra bge-flag     FlagEmbedding backend (BGEM3FlagModel)
# torch is named explicitly so the Linux CPU index below applies: a uv source
# only binds to a direct dependency.
bge = ["sentence-transformers>=3.0.0", "torch>=2.0"]
bge-flag = ["FlagEmbedding>=1.3.0", "torch>=2.0"]

# The default PyPI torch wheel pulls the whole CUDA runtime on Linux, which a
# CPU-only container has no use for. Windows and macOS are unaffected.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
rag-app = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
