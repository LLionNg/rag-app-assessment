app:
  name: rag-app-assessment
  environment: local

logging:
  level: INFO
  file: logs/app.log
  rotation: 10 MB
  retention: 7 days
  serialize: false

llm:
  provider: bbl_gateway # azure_openai | bbl_gateway | openai | mock
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 120
  max_retries: 4
  retry_backoff_seconds: 20.0
  providers:
    bbl_gateway:
      model: gpt-5-mini
      base_url: https://apimsdbxcandidate01.azure-api.net/llm
      api_key_env: BBL_LLM_API_KEY
      auth_header: api-key
      token_param: max_output_tokens
      supports_temperature: false # gpt-5-mini rejects the parameter outright
      reasoning_effort: low # cuts hidden reasoning tokens by roughly half
      parallel_tool_calls: false
      max_tool_calls: 1
    azure_openai:
      model: gpt-5-mini
      endpoint: https://oaibblinnocandiddate01.openai.azure.com/
      deployment: gpt-5-mini
      api_version: "2024-12-01-preview"
      api_key_env: AZURE_OPENAI_API_KEY
      token_param: max_completion_tokens
      supports_temperature: false
    openai:
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      token_param: max_tokens
      supports_temperature: true
    mock:
      model: mock-llm

embeddings:
  provider: bge_m3 # null disables embeddings entirely
  batch_size: 16 # texts per concurrent task (see options.batch_size for the model's own)
  timeout_seconds: 300
  max_retries: 1
  # Persisted index: a .npz matrix plus a JSON manifest. No database.
  store:
    enabled: true
    path: data/index
    name: knowledge_base
    refresh: false # or pass --reindex
  providers:
    bge_m3:
      model: BAAI/bge-m3
      dimensions: 1024 # BGE-M3 dim
      options:
        backend: flag_embedding # sentence_transformers | flag_embedding
        batch_size: 12 # the model's own micro-batch
        cache_dir: null # null uses the default HuggingFace cache
        use_fp16: false # flag_embedding only
        max_length: 8192 # flag_embedding only
        device: null # sentence_transformers only; null picks cuda/cpu
    azure_openai:
      model: text-embedding-3-small
      dimensions: 1536
      endpoint: https://oaibblinnocandiddate01.openai.azure.com/
      deployment: text-embedding-3-small
      api_version: "2024-02-01"
      api_key_env: AZURE_OPENAI_API_KEY
    openai:
      model: text-embedding-3-small
      dimensions: 1536
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY

knowledge_base:
  path: data/knowledge_base.txt
  encoding: utf-8
  chunking:
    strategy: paragraph # paragraph | fixed
    max_chars: 1400 # longest section is 1318, so each stays one chunk
    min_chars: 80
    overlap_chars: 180

retrieval:
  strategy: semantic # keyword | semantic | hybrid
  top_k: 5
  min_score: 0.05
  keyword:
    k1: 1.5
    b: 0.75
  semantic:
    min_similarity: 0.48 # measured: on-topic >= 0.52, off-topic <= 0.44
  hybrid:
    rrf_k: 60
    weights:
      keyword: 0.5
      semantic: 0.5

agents:
  data_retriever:
    name: Data Retriever
    max_tool_iterations: 1
    max_snippets: 4
  report_generator:
    name: Report Generator
    max_snippet_chars: 1400 # matches chunking.max_chars

orchestration:
  engine: sequential

ui:
  title: Two-Agent RAG
  host: 127.0.0.1
  port: 7860
  share: false # true publishes a temporary public link
  open_browser: true

demo:
  queries:
    - What is the policy on international travel?
    - How do I get reimbursed after a business trip?
    - What are the rules for working from home and keeping customer data safe?
    - How much parental leave am I entitled to?
