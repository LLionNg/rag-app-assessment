app:
  name: rag-app-assessment
  environment: local

logging:
  level: INFO
  file: logs/app.log
  rotation: 10 MB
  retention: 7 days
  serialize: false

llm:
  # bbl_gateway is the assessment endpoint; mock is the offline placeholder.
  provider: bbl_gateway
  temperature: 0.2
  max_tokens: 2048
  timeout_seconds: 120
  # A metered token window is cleared in seconds, not milliseconds. The gateway's
  # Retry-After is preferred when it sends one.
  max_retries: 4
  retry_backoff_seconds: 20.0
  providers:
    # Azure OpenAI Responses API behind an API Management gateway. The endpoint
    # in the assessment brief was superseded by this one.
    bbl_gateway:
      model: gpt-5-mini
      base_url: https://apimsdbxcandidate01.azure-api.net/llm
      api_key_env: BBL_LLM_API_KEY
      auth_header: api-key
      token_param: max_output_tokens
      supports_temperature: false # gpt-5-mini rejects the parameter outright
      reasoning_effort: low # cuts hidden reasoning tokens by roughly half
      # The grant is 1000 tokens/minute. Every parallel search replays its full
      # result into the next request, so one search per turn keeps us in budget.
      parallel_tool_calls: false
      max_tool_calls: 1
    azure_openai:
      model: gpt-5-mini
      endpoint: https://oaibblinnocandiddate01.openai.azure.com/
      deployment: gpt-5-mini
      api_version: "2024-12-01-preview"
      api_key_env: AZURE_OPENAI_API_KEY
      # gpt-5 family rejects `max_tokens` and any non-default temperature.
      token_param: max_completion_tokens
      supports_temperature: false
    openai:
      model: gpt-4o-mini
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      token_param: max_tokens
      supports_temperature: true
    mock:
      model: mock-llm

embeddings:
  # Set to null to fall back to keyword-only retrieval.
  provider: bge_m3
  batch_size: 16 # texts per concurrent task (see options.batch_size for the model's own)
  timeout_seconds: 300
  max_retries: 1
  # Persisted index: a .npz matrix plus a JSON manifest. No database.
  store:
    enabled: true
    path: data/index
    name: knowledge_base
    refresh: false # or pass --reindex
  providers:
    bge_m3:
      model: BAAI/bge-m3
      dimensions: 1024 # BGE-M3 dim
      options:
        backend: flag_embedding # sentence_transformers | flag_embedding
        batch_size: 12 # the model's own micro-batch
        cache_dir: null # null uses the default HuggingFace cache
        use_fp16: false # flag_embedding only
        max_length: 8192 # flag_embedding only
        device: null # sentence_transformers only; null picks cuda/cpu
    azure_openai:
      model: text-embedding-3-small
      dimensions: 1536
      endpoint: https://oaibblinnocandiddate01.openai.azure.com/
      deployment: text-embedding-3-small
      api_version: "2024-02-01"
      api_key_env: AZURE_OPENAI_API_KEY
    openai:
      model: text-embedding-3-small
      dimensions: 1536
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY

knowledge_base:
  path: data/knowledge_base.txt
  encoding: utf-8
  chunking:
    strategy: paragraph # paragraph | fixed
    max_chars: 900
    min_chars: 80
    overlap_chars: 120

retrieval:
  strategy: semantic # keyword | semantic | hybrid
  top_k: 4
  min_score: 0.05
  keyword:
    k1: 1.5
    b: 0.75
    # Quoted because YAML reads bare `on`/`no` as booleans.
    stopwords:
      ["a", "an", "and", "are", "as", "at", "be", "by", "can", "do", "does",
       "for", "from", "how", "i", "if", "in", "is", "it", "my", "of", "on",
       "or", "our", "that", "the", "their", "this", "to", "was", "what",
       "when", "where", "which", "who", "will", "with", "you", "your"]
  semantic:
    # Model-specific: an absolute cosine floor does not transfer between
    # embedding models. Calibrated for BGE-M3 on this corpus, where on-topic
    # hits land at 0.46-0.73 and off-topic queries peak at 0.33. Re-measure
    # before changing the embedding model.
    min_similarity: 0.40
  hybrid:
    rrf_k: 60
    weights:
      keyword: 0.5
      semantic: 0.5

agents:
  data_retriever:
    name: Data Retriever
    # One search, then a forced wrap-up: three metered calls per query, not five.
    max_tool_iterations: 1
    max_snippets: 4
  report_generator:
    name: Report Generator
    max_snippet_chars: 700 # a full chunk, without the metered tail

orchestration:
  engine: langgraph

demo:
  queries:
    - What is the policy on international travel?
    - How do I get reimbursed after a business trip?
    - What are the rules for working from home and keeping customer data safe?
    - How much parental leave am I entitled to?
